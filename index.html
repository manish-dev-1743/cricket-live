<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASH ClearKey Live Player</title>

  <!-- Shaka Player UI + Core CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .player-wrapper {
      width: 100%;
      max-width: 960px;
      background: #161e2e;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }

    .controls-bar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    select {
      background: #111827;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
    }

    .log-bar {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #9ca3af;
      background: #111827;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <div class="controls-bar">
      <strong>Live DASH Player</strong>
      <select id="streamSelector">
        <option value="fancode_fhd" selected>FANCODE FHD (Stream 1)</option>
        <option value="fancode_sd">FANCODE SD (Stream 2)</option>
        <option value="fancode2_fhd">FANCODE2 FHD (Stream 3)</option>
      </select>
    </div>

    <!-- Container wrapper for Shaka UI -->
    <div class="video-container" id="videoContainer" data-shaka-player-container>
      <video data-shaka-player id="videoElement" autoplay playsinline></video>
    </div>

    <div class="log-bar" id="statusMessage">Initializing player...</div>
  </div>

  <script>
    const streams = {
      fancode_fhd: {
        url: "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/b3b3fkmrbl/out/v1/1084d5c9a97a4c5b9f9554c88f486646/cenc.mpd",
        keys: {
          "82dfca238e8c4b430a3269db71965db9": "a00b28caf4ac628e77a553d440c0ddca"
        }
      },
      fancode_sd: {
        url: "https://abfjk4haaaaaaaamkitc5445rybm6.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash-sd/enc/iwpchve3wl/out/v1/946019f85dc64ae99ff9ce64a9727a62/cenc-sd.mpd",
        keys: {
          "286eb7dc538143790fa9913639531920": "e3f5cb08d14d9e9c08438c673819540f"
        }
      },
      fancode2_fhd: {
        url: "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/avqlywnuzx/out/v1/aefca6420f944a9482e117f315de535f/cenc.mpd",
        keys: {
          "1994b1df7dfd2e8a8d7b9bf3fb900285": "22a1444b3da18e139191665b3d652835"
        }
      }
    };

    let playerInstance = null;
    const statusMsg = document.getElementById("statusMessage");

    async function playSelectedStream(streamKey) {
      const stream = streams[streamKey];
      statusMsg.textContent = `Configuring DRM & Loading ${streamKey}...`;

      try {
        // Configure ClearKey and streaming performance
        playerInstance.configure({
          drm: {
            clearKeys: stream.keys
          },
          manifest: {
            dash: {
              ignoreMinBufferTime: true,
              autoCorrectDrift: true
            }
          },
          streaming: {
            bufferingGoal: 10,
            rebufferingGoal: 2,
            bufferBehind: 15,
            lowLatencyMode: true,
            inaccurateManifestTolerance: 2
          }
        });

        await playerInstance.load(stream.url);
        statusMsg.textContent = `Streaming live: ${streamKey}`;
      } catch (err) {
        console.error("Playback Failure:", err);
        statusMsg.textContent = `Playback error: Code ${err.code || 'ERR'} (Category ${err.category || 'N/A'})`;
      }
    }

    async function init() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        statusMsg.textContent = "Browser does not support EME/MSE streaming.";
        return;
      }

      const container = document.getElementById("videoContainer");
      const overlay = container["ui"];

      // Retrieve the player instance from the overlay controls
      const controls = overlay.getControls();
      playerInstance = controls.getPlayer();

      playerInstance.addEventListener("error", (e) => {
        console.error("Shaka error event:", e.detail);
      });

      document.getElementById("streamSelector").addEventListener("change", (e) => {
        playSelectedStream(e.target.value);
      });

      // Load initial stream
      await playSelectedStream("fancode_fhd");
    }

    // Bind initialization to the UI ready event
    document.addEventListener("shaka-ui-loaded", init);
  </script>
</body>
</html>
