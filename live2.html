<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Channel HLS Stream Player</title>
  <!-- hls.js for MSE-based HLS playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .player-card {
      width: 100%;
      max-width: 960px;
      background: #1e293b;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .dashboard-panel {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .channel-selector {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .channel-btn {
      flex: 1;
      min-width: 140px;
      padding: 0.75rem 1rem;
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .channel-btn:hover {
      background: #1e293b;
      border-color: #64748b;
      color: #fff;
    }

    .channel-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .channel-badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .reload-btn {
      padding: 0.65rem 1.25rem;
      background: #334155;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reload-btn:hover {
      background: #475569;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 0.75rem;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      margin-right: 6px;
    }

    .status-indicator.live {
      background: #22c55e;
    }

    .status-indicator.error {
      background: #ef4444;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="video-container">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="dashboard-panel">
      <!-- Stream Switchers -->
      <div class="channel-selector">
        <button class="channel-btn active" data-index="0">
          <span>Premium HD</span>
          <span class="channel-badge">Stream 1</span>
        </button>
        <button class="channel-btn" data-index="1">
          <span>Himalaya Sports 2 HD</span>
          <span class="channel-badge">Nepali</span>
        </button>
        <button class="channel-btn" data-index="2">
          <span>Himalaya Net (1.5M)</span>
          <span class="channel-badge">Nepali Alt</span>
        </button>
      </div>

      <!-- Raw Stream URL / Manual Override -->
      <div class="input-group">
        <input type="text" id="streamUrl" placeholder="Stream endpoint (.m3u8)..." />
        <button class="reload-btn" id="loadCustomBtn">Reload</button>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <span id="engineStatus">Engine: Detecting...</span>
        <span>
          <span id="statusDot" class="status-indicator"></span>
          <span id="streamStatus">Status: Idle</span>
        </span>
      </div>
    </div>
  </div>

  <script>
    const STREAMS = [
      {
        name: "Premium HD",
        url: "http://202.79.40.253/iptvlivestream/hpremiumPAID/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9MTEvMy8yMDI2IDExOjQ4OjE1IEFNJmhhc2hfdmFsdWU9dVJ1NGFHSllCOUF1Y3lMaXpTN2V4QT09JnZhbGlkbWludXRlcz0xNDQwJmlkPTIwMA=="
      },
      {
        name: "Himalaya Sports 2 HD",
        url: "http://202.79.40.253/iptvlivestream/himalayasports2hd/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9MTEvMy8yMDI2IDExOjQ4OjQ1IEFNJmhhc2hfdmFsdWU9NXJET1BqVHdRQUQycmgxNUVsaGRZQT09JnZhbGlkbWludXRlcz0xNDQwJmlkPTIwMA=="
      },
      {
        name: "Himalaya Net (1.5M)",
        url: "http://202.79.40.253/iptvlivestream/netHIMALAYA1500.stream/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9MTEvMy8yMDI2IDExOjQ5OjA0IEFNJmhhc2hfdmFsdWU9ZklyVGlQcjJsaXplZGRscTZBWTBEQT09JnZhbGlkbWludXRlcz0xNDQwJmlkPTIwMA=="
      }
    ];

    const video = document.getElementById('videoPlayer');
    const input = document.getElementById('streamUrl');
    const loadCustomBtn = document.getElementById('loadCustomBtn');
    const engineStatus = document.getElementById('engineStatus');
    const streamStatus = document.getElementById('streamStatus');
    const statusDot = document.getElementById('statusDot');
    const buttons = document.querySelectorAll('.channel-btn');

    let hlsInstance = null;

    function setStatus(text, state = 'pending') {
      streamStatus.textContent = text;
      statusDot.className = 'status-indicator';
      if (state === 'live') statusDot.classList.add('live');
      if (state === 'error') statusDot.classList.add('error');
    }

    function switchStream(url) {
      if (!url) return;
      input.value = url;
      setStatus('Loading manifest...', 'pending');

      if (hlsInstance) {
        hlsInstance.destroy();
      }

      if (Hls.isSupported()) {
        engineStatus.textContent = 'Engine: hls.js (MSE)';
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus('Playing Live', 'live');
          video.play().catch(() => {
            setStatus('Autoplay muted/blocked (Press Play)', 'pending');
          });
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                setStatus('Network/CORS/Auth Error', 'error');
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                setStatus('Codec/Media Decode Error', 'error');
                hlsInstance.recoverMediaError();
                break;
              default:
                setStatus('Fatal Error: Stream Unreachable', 'error');
                hlsInstance.destroy();
                break;
            }
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        engineStatus.textContent = 'Engine: Native Safari/HLS';
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          setStatus('Playing Live', 'live');
          video.play();
        });
      } else {
        engineStatus.textContent = 'Engine: Unsupported';
        setStatus('Browser does not support HLS', 'error');
      }
    }

    // Channel button bindings
    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const streamIndex = parseInt(btn.getAttribute('data-index'), 10);
        switchStream(STREAMS[streamIndex].url);
      });
    });

    // Custom load button binding
    loadCustomBtn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      switchStream(input.value.trim());
    });

    // Initial boot on Stream 1
    window.addEventListener('DOMContentLoaded', () => {
      input.value = STREAMS[0].url;
      switchStream(STREAMS[0].url);
    });
  </script>
</body>
</html>
